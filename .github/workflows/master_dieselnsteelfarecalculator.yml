# Docs for the Azure Web Apps Deploy action: https://github.com
# More GitHub Actions for Azure: https://github.com

name: Build and deploy ASP.Net Core app to Azure Web App - DieselNSteelFareCalculator

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build and Publish Blazor WASM
        run: dotnet publish -c Release -o ./publishoutput

      - name: Add SPA Routing Fallback Rule
        run: cp ./publishoutput/wwwroot/index.html ./publishoutput/wwwroot/404.html

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publishoutput/wwwroot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CDDCF5FCFB254A81B6579739516E9A44 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0163D4BC781741A1B7FE7E4E49D0DE73 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EE9F979977D14CB8921C4B4296DB257B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'DieselNSteelFareCalculator'
          slot-name: 'Production'
          package: .
